# Casos de teste da extração de e-mail + classificação por IA.
#
# COMO USAR
# ---------
# Cada item desta lista é um e-mail de teste. Edite/adicione à vontade — os três
# testes (extração, IA mockada, IA real) leem este arquivo automaticamente.
#
# Campos por caso:
#   id        : identificador curto e único (vira o id do teste no pytest).
#   sender    : endereço do remetente.
#   subject   : assunto do e-mail.
#   body_text : (opcional) corpo em TEXTO PURO.
#   body_html : (opcional) corpo em HTML BRUTO (cole o HTML real do e-mail aqui).
#               Informe body_text e/ou body_html (ao menos um). Os dois juntos
#               simulam um e-mail multipart real (texto + HTML).
#
#   expect_extraction.contains : (opcional) trechos que DEVERIAM sobreviver à
#       transformação HTML→texto. O relatório mostra quais se perderam.
#
#   open_applications : (opcional) candidaturas abertas que a IA "vê" como
#       contexto. Cada uma tem key/company/role/status. Use 'key' para apontar
#       em expect.application.
#
#   expect : gabarito da IA.
#       intent           : atualizacao | nova_unica | lista | irrelevante
#       suggested_status : draft|applied|confirmed|screening|interview|offer|
#                          rejected|withdrawn|archived  (ou "" se não se aplica)
#       application      : (opcional) key de open_applications que a IA deve apontar
#       opportunities    : lista de {company, role} esperada (vagas/listas)
#       min_confidence   : (opcional) piso de confiança esperado (camada real)

- id: convite-entrevista-multipart
  sender: rh@acme.com
  subject: "Vamos agendar sua entrevista"
  body_text: |
    Olá! Gostamos do seu perfil e queremos agendar sua entrevista para a vaga
    de Desenvolvedora Backend. Qual a sua disponibilidade na próxima semana?
  body_html: |
    <p>Olá! Gostamos do seu perfil e queremos agendar sua <b>entrevista</b> para
    a vaga de <i>Desenvolvedora Backend</i>. Qual a sua disponibilidade?</p>
  open_applications:
    - key: acme
      company: ACME
      role: Desenvolvedora Backend
      status: applied
  expect_extraction:
    contains: ["entrevista", "Desenvolvedora Backend"]
  expect:
    intent: atualizacao
    suggested_status: interview
    application: acme
    opportunities: []
    min_confidence: 50

- id: rejeicao-texto-puro
  sender: nao-responda@bigcorp.com
  subject: "Atualização sobre sua candidatura"
  body_text: |
    Agradecemos seu interesse na vaga de Analista de Dados. Após avaliação,
    decidimos seguir com outros candidatos neste momento. Desejamos sucesso.
  open_applications:
    - key: bigcorp
      company: BigCorp
      role: Analista de Dados
      status: screening
  expect_extraction:
    contains: ["Analista de Dados", "outros candidatos"]
  expect:
    intent: atualizacao
    suggested_status: rejected
    application: bigcorp
    opportunities: []
    min_confidence: 50

- id: vaga-unica-recrutador
  sender: ana.recruta@talentos.com
  subject: "Oportunidade de Engenheiro de Plataforma na Initech"
  body_text: |
    Oi! Encontrei seu perfil e tenho uma vaga de Engenheiro de Plataforma na
    Initech, modelo remoto. Tem interesse? Detalhes: https://initech.io/vaga/42
  expect_extraction:
    contains:
      ["Engenheiro de Plataforma", "Initech", "https://initech.io/vaga/42"]
  expect:
    intent: nova_unica
    suggested_status: ""
    opportunities:
      - {company: Initech, role: Engenheiro de Plataforma}
    min_confidence: 40

- id: newsletter-html-only
  sender: vagas@jobboard.com
  subject: "3 vagas de Python para você"
  # Corpo SÓ em HTML (como muitas newsletters). Hoje a extração retorna "" —
  # a IA recebe apenas remetente + assunto. Este caso comprova a perda total.
  body_html: |
    <html><body>
      <h1>Vagas da semana</h1>
      <ul>
        <li><a href="https://jobs.globex.com/123">Backend Python — Globex</a></li>
        <li><a href="https://initech.io/vaga">Engenheiro de Dados — Initech</a></li>
        <li><a href="https://umbrella.dev/jobs/9">DevOps — Umbrella</a></li>
      </ul>
      <p>Prazo de inscrição: 30/06.</p>
    </body></html>
  expect_extraction:
    contains:
      - "Globex"
      - "Initech"
      - "Umbrella"
      - "https://jobs.globex.com/123"
      - "30/06"
  expect:
    intent: lista
    suggested_status: ""
    opportunities:
      - {company: Globex, role: Backend Python}
      - {company: Initech, role: Engenheiro de Dados}
      - {company: Umbrella, role: DevOps}
    min_confidence: 30

